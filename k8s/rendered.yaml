apiVersion: v1
data:
  application-prod.yaml: |
    server:
      port: 8080

    developer:
      owner:
        name: sk026
        role: kubernetes
        level: high
      team:
        position: "5th floor"
        detail: class-1

    # H2 설정
    spring:
      datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
      h2:
        console:
          enabled: true
          path: /h2-console
      jpa:
        hibernate:
          ddl-auto: create-drop
        show-sql: true
        defer-datasource-initialization: true
      sql:
        init:
          mode: always
kind: ConfigMap
metadata:
  labels:
    lab: sk026-pages-175-230
    owner: sk026
  name: sk026-backend-configmap
  namespace: class-1
---
apiVersion: v1
kind: Service
metadata:
  labels:
    lab: sk026-pages-175-230
    owner: sk026
  name: sk026-myfirst-api-server
  namespace: class-1
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: sk026-myfirst-api-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    lab: sk026-pages-175-230
    owner: sk026
  name: sk026-myfirst-api-server
  namespace: class-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk026-myfirst-api-server
  template:
    metadata:
      labels:
        app: sk026-myfirst-api-server
        lab: sk026-pages-175-230
        owner: sk026
    spec:
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: JAVA_OPTS
          value: -Xms64m -Xmx256m
        image: skala-registry.skala-us.com/class-1/sk026-webserver:p239-k8s-buildkit-2-bfb8b6d
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
        name: myfirst-api-server
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 384Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 3
        volumeMounts:
        - mountPath: /app/config
          name: config
          readOnly: true
      imagePullSecrets:
      - name: sk026-gitops-registry
      volumes:
      - configMap:
          name: sk026-backend-configmap
        name: config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    lab: sk026-pages-175-230
    owner: sk026
  name: sk026-myfirst-ingress
  namespace: class-1
spec:
  ingressClassName: nginx
  rules:
  - host: sk026-myfirst-ingress.class-1.skala-us.com
    http:
      paths:
      - backend:
          service:
            name: sk026-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - sk026-myfirst-ingress.class-1.skala-us.com
    secretName: wildcard-class-1-skala-us-com-tls
